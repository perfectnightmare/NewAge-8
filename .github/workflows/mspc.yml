name: Run mspc.js

on:
  workflow_dispatch:
    inputs:
      run_extra:
        description: 'Run the extra tasks (extra-tasks.js) after the common ones? true / false'
        required: false
        default: 'false'
        type: string

jobs:
  run-mspc:
    runs-on: ubuntu-22.04
    # runs-on: ubuntu-latest (optional)
    timeout-minutes: 150

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 🟢 Cache node_modules
      - name: Cache Node.js dependencies
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📦 Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install

      # 🟢 Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🌐 Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: 🚀 Run mspc.js script
        run: node mspc.js
        env:
          LP_ACCOUNTS: ${{ secrets.LP_ACCOUNTS }}
          LP_MAPS_URL: ${{ secrets.LP_MAPS_URL }}
          LP_SLOTS_URL: ${{ secrets.LP_SLOTS_URL }}
          LP_FASHION_MAGAZINE_URL: ${{ secrets.LP_FASHION_MAGAZINE_URL }}
          TICKET_RESERVE: 95
          OUTFIT_DRY_RUN: 0
          BOARD_URL: ${{ secrets.BOARD_URL }}
          BOARD_PASSWORD: ${{ secrets.BOARD_PASSWORD }}
          RUN_EXTRA: ${{ github.event.inputs.run_extra || 'false' }}

      - name: 🖼️ Upload error screenshots if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: |
            login-error-*.png
            cookie-error.png
            maps-error.png
            slots-error.png
            burn-error.png
            bp-fallback-error.png
            bp-error-*.png
